runtime: nodejs20
env: standard

handlers:
# Mengarahkan / langsung ke index.html di dalam folder frontend
- url: /
  static_files: frontend/index.html
  upload: frontend/index.html

# Mengarahkan file pendukung (css, js) ke dalam folder frontend
- url: /(.*)
  static_files: frontend/\1
  upload: frontend/(.*)